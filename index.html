<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brawl Stars Offer Comparator</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://media.ffycdn.net/eu/supercell/9a9ndWqotDNonqQQcFpz.png?width=2400">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color: #e0e0e0;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .card {
      background: rgba(30, 30, 30, 0.9);
      backdrop-filter: blur(12px);
      padding: 26px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      width: 90%;
      max-width: 380px;
      border: 1px solid rgba(255,255,255,0.05);

      margin: auto;
    }

    h3 {
      font-size: 24px;
      margin-bottom: 12px;
      text-align: center;
    }

    .baseline {
      font-size: 13px;
      color: #aaa;
      margin: 4px 0;
      text-align: center;
    }

    label {
      font-size: 14px;
      margin-top: 14px;
      display: block;
      color: #ccc;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 16px;
      transition: 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #4f8cff;
      box-shadow: 0 0 6px rgba(79,140,255,0.5);
    }

    input::placeholder {
      color: #777;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #4f8cff, #6aa6ff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(79,140,255,0.4);
    }

    .result {
      margin-top: 14px;
      font-weight: bold;
      text-align: center;
      font-size: 16px;
      padding: 10px;
      border-radius: 10px;
    }

    .worth {
      background: rgba(0, 200, 120, 0.15);
      color: #00d084;
      border: 1px solid rgba(0, 200, 120, 0.4);
    }

    .not-worth {
      background: rgba(255, 80, 80, 0.15);
      color: #ff5c5c;
      border: 1px solid rgba(255, 80, 80, 0.4);
    }

    .error {
      color: #ff5c5c;
      text-align: center;
      margin-top: 10px;
    }

    .footer {
      text-align: center;
      padding: 14px;
      font-size: 11px;
      color: #777;
    }

    @media (max-width: 480px) {
      h3 {
        font-size: 26px;
      }

      input,
      button {
        font-size: 18px;
        padding: 16px;
      }

      .result {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="card">
    <h3>💎 Brawl Stars Offer Comparator</h3>

    <p class="baseline">Baseline A: 79 gems = 2000 coins/PP</p>
    <p class="baseline">Baseline B: 79 gems = 5000 coins/PP</p>

    <label>Gems</label>
    <input type="number" id="gems" placeholder="Enter gems">

    <label>Coins / PP</label>
    <input type="number" id="coins" placeholder="Enter coins or PP">

    <div id="error" class="error"></div>
    <div id="resultA" class="result"></div>
    <div id="resultB" class="result"></div>
    <div id="valueDisplay" class="baseline"></div>
  </div>

  <footer class="footer">
    👁️ <span id="views">...</span> views
  </footer>

</div>

<script>
const gemsInput = document.getElementById('gems');
const coinsInput = document.getElementById('coins');

gemsInput.addEventListener('input', compare);
coinsInput.addEventListener('input', compare);

function compare() {
  const gems = parseFloat(gemsInput.value);
  const coins = parseFloat(coinsInput.value);

  const resultA = document.getElementById('resultA');
  const resultB = document.getElementById('resultB');
  const error = document.getElementById('error');
  const valueDisplay = document.getElementById('valueDisplay');

  resultA.className = "result";
  resultB.className = "result";
  error.innerText = "";
  valueDisplay.innerText = "";

  if (!gems || !coins) {
    resultA.innerText = "";
    resultB.innerText = "";
    return;
  }

  const baselineA = 2000 / 79;
  const baselineB = 5000 / 79;
  const userRatio = coins / gems;

  valueDisplay.innerText =
    `Your value: ${userRatio.toFixed(2)} | ` +
    `Baseline A: ${baselineA.toFixed(2)} | ` +
    `Baseline B: ${baselineB.toFixed(2)}`;

  if (userRatio >= baselineA) {
    resultA.innerText = "✅ Worth (2000 baseline)";
    resultA.classList.add("worth");
  } else {
    resultA.innerText = "❌ Not worth (2000 baseline)";
    resultA.classList.add("not-worth");
  }

  if (userRatio >= baselineB) {
    resultB.innerText = "✅ Worth (5000 baseline)";
    resultB.classList.add("worth");
  } else {
    resultB.innerText = "❌ Not worth (5000 baseline)";
    resultB.classList.add("not-worth");
  }
}
</script>

<script>
fetch('https://countapi.mileshilliard.com/api/v1/hit/boypipe-bs-offer-calculator')
  .then(res => res.json())
  .then(data => {
    document.getElementById('views').textContent =
      data.value.toLocaleString();
  })
  .catch(err => {
    console.error(err);
    document.getElementById('views').textContent = '?';
  });
</script>

</body>
</html>
