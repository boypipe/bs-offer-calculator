<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Offer Comparator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f5f5f5;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 320px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .result {
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
    }
    .baseline {
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h3>Offer Comparator</h3>
    <p class="baseline">Baseline A: 79 gems = 2000 coins/PP</p>
    <p class="baseline">Baseline B: 79 gems = 5000 coins/PP</p>

    <label>Gems:</label>
    <input type="number" id="gems" placeholder="Enter gems">

    <label>Coins / PP:</label>
    <input type="number" id="coins" placeholder="Enter coins or PP">

    <button onclick="compare()">Check</button>

    <div class="result" id="resultA"></div>
    <div class="result" id="resultB"></div>
  </div>

  <script>
    function compare() {
      const gems = parseFloat(document.getElementById('gems').value);
      const coins = parseFloat(document.getElementById('coins').value);

      if (!gems || !coins) {
        document.getElementById('resultA').innerText = "Enter valid values";
        document.getElementById('resultB').innerText = "";
        return;
      }

      // baselines
      const baselineA = 2000 / 79;
      const baselineB = 5000 / 79;

      const userRatio = coins / gems;

      // Compare against baseline A
      if (userRatio >= baselineA) {
        document.getElementById('resultA').innerText = "Against 2000 baseline: WORTH";
      } else {
        document.getElementById('resultA').innerText = "Against 2000 baseline: NOT WORTH";
      }

      // Compare against baseline B
      if (userRatio >= baselineB) {
        document.getElementById('resultB').innerText = "Against 5000 baseline: WORTH";
      } else {
        document.getElementById('resultB').innerText = "Against 5000 baseline: NOT WORTH";
      }
    }
  </script>
</body>
</html>
