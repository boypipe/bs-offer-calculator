<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offer Comparator</title>
  <link rel="icon" type="image/png" href="/griff_happy_pin.png">
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 380px;
    }

    h3 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .baseline {
      font-size: 13px;
      color: #555;
      margin: 4px 0;
    }

    label {
      font-size: 14px;
      margin-top: 10px;
      display: block;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    button:hover {
      background: #0056b3;
    }

    .result {
      margin-top: 12px;
      font-weight: bold;
      text-align: center;
      font-size: 16px;
    }

    /* Mobile boost */
    @media (max-width: 480px) {
      .card {
        padding: 28px;
        border-radius: 16px;
      }

      h3 {
        font-size: 24px;
      }

      input, button {
        font-size: 18px;
        padding: 16px;
      }

      .result {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h3>Offer Comparator</h3>
    <p class="baseline">Baseline A: 79 gems = 2000 coins/PP</p>
    <p class="baseline">Baseline B: 79 gems = 5000 coins/PP</p>

    <label>Gems:</label>
    <input type="number" id="gems" placeholder="Enter gems">

    <label>Coins / PP:</label>
    <input type="number" id="coins" placeholder="Enter coins or PP">

    <button onclick="compare()">Check</button>

    <div class="result" id="resultA"></div>
    <div class="result" id="resultB"></div>
  </div>

  <script>
    function compare() {
      const gems = parseFloat(document.getElementById('gems').value);
      const coins = parseFloat(document.getElementById('coins').value);

      if (!gems || !coins) {
        document.getElementById('resultA').innerText = "Enter valid values";
        document.getElementById('resultB').innerText = "";
        return;
      }

      const baselineA = 2000 / 79;
      const baselineB = 5000 / 79;

      const userRatio = coins / gems;

      document.getElementById('resultA').innerText =
        userRatio >= baselineA
          ? "Against 2000 baseline: WORTH"
          : "Against 2000 baseline: NOT WORTH";

      document.getElementById('resultB').innerText =
        userRatio >= baselineB
          ? "Against 5000 baseline: WORTH"
          : "Against 5000 baseline: NOT WORTH";
    }
  </script>
</body>
</html>
