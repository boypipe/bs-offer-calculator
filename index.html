<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offer Comparator</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://media.ffycdn.net/eu/supercell/9a9ndWqotDNonqQQcFpz.png?width=2400">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color: #e0e0e0;
    }

    .card {
      background: rgba(30, 30, 30, 0.9);
      backdrop-filter: blur(12px);
      padding: 26px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      width: 90%;
      max-width: 380px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    h3 {
      font-size: 24px;
      margin-bottom: 12px;
      text-align: center;
    }

    .baseline {
      font-size: 13px;
      color: #aaa;
      margin: 4px 0;
      text-align: center;
    }

    label {
      font-size: 14px;
      margin-top: 14px;
      display: block;
      color: #ccc;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 16px;
      transition: 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #4f8cff;
      box-shadow: 0 0 6px rgba(79,140,255,0.5);
    }

    input::placeholder {
      color: #777;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #4f8cff, #6aa6ff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(79,140,255,0.4);
    }

    .result {
      margin-top: 14px;
      font-weight: bold;
      text-align: center;
      font-size: 16px;
      padding: 10px;
      border-radius: 10px;
    }

    .worth {
      background: rgba(0, 200, 120, 0.15);
      color: #00d084;
      border: 1px solid rgba(0, 200, 120, 0.4);
    }

    .not-worth {
      background: rgba(255, 80, 80, 0.15);
      color: #ff5c5c;
      border: 1px solid rgba(255, 80, 80, 0.4);
    }

    .error {
      color: #ff5c5c;
      text-align: center;
      margin-top: 10px;
    }

    @media (max-width: 480px) {
      h3 {
        font-size: 26px;
      }

      input, button {
        font-size: 18px;
        padding: 16px;
      }

      .result {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <h3>💎 Offer Comparator</h3>

    <p class="baseline">79 gems = 2000 coins</p>
    <p class="baseline">79 gems = 5000 coins</p>

    <label>Gems</label>
    <input type="number" id="gems" placeholder="Enter gems">

    <label>Coins / PP</label>
    <input type="number" id="coins" placeholder="Enter coins or PP">

    <button onclick="compare()">Check Value</button>

    <div id="error" class="error"></div>
    <div id="resultA" class="result"></div>
    <div id="resultB" class="result"></div>
  </div>

  <script>
    function compare() {
      const gems = parseFloat(document.getElementById('gems').value);
      const coins = parseFloat(document.getElementById('coins').value);

      const resultA = document.getElementById('resultA');
      const resultB = document.getElementById('resultB');
      const error = document.getElementById('error');

      resultA.className = "result";
      resultB.className = "result";
      error.innerText = "";

      if (!gems || !coins) {
        error.innerText = "Please enter valid numbers";
        resultA.innerText = "";
        resultB.innerText = "";
        return;
      }

      const baselineA = 2000 / 79;
      const baselineB = 5000 / 79;
      const userRatio = coins / gems;

      if (userRatio >= baselineA) {
        resultA.innerText = "✅ Worth (2000 baseline)";
        resultA.classList.add("worth");
      } else {
        resultA.innerText = "❌ Not worth (2000 baseline)";
        resultA.classList.add("not-worth");
      }

      if (userRatio >= baselineB) {
        resultB.innerText = "✅ Worth (5000 baseline)";
        resultB.classList.add("worth");
      } else {
        resultB.innerText = "❌ Not worth (5000 baseline)";
        resultB.classList.add("not-worth");
      }
    }
  </script>
</body>
</html>
